services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
      POSTGRES_DB: geofence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://geofence:geofence@db:5432/geofence?sslmode=disable
      LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time. The browser runs on the
        # host, so it reaches the backend via the host-published port.
        VITE_API_BASE_URL: "http://localhost:8080"
        VITE_WS_URL: "ws://localhost:8080/ws/alerts"
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
